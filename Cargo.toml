[workspace]
resolver = "3"
members = ["crates/wok-bench", "crates/wok-roomd", "crates/wok-store", "crates/wok-ws", "crates/wokd"]

[workspace.package]
version = "0.8.2"
edition = "2024"
rust-version = "1.89"
license = "MIT"
authors = ["TheCryptoDonkey"]
repository = "https://github.com/forgesworn/wok"

# What the workspace's own programs (`wokd`, `wok-roomd`, `wok-bench`) are
# built with. An application that links the libraries builds them under its
# own profile; this one does not reach it.
[profile.release]
# Whole-program optimisation in one unit, for size: `wokd` is about a fifth
# smaller (6.1 MB against 7.6 on arm64 macOS, measured on 24 November 2026)
# and the build about twice as long. Speed is level, within 3 per cent.
lto = "fat"
codegen-units = 1
# No symbol table (5.6 MB). A panic still names its file and line; a
# backtrace then shows addresses, not names.
strip = true

[workspace.dependencies]
# The same axum as Bothy, whose routers merge with this crate's.
axum = { version = "0.8.9", features = ["ws"] }
fs2 = "0.4.3"
futures-util = "0.3"
hex = "0.4"
negentropy = "0.5.2"
# `os-rng`: the relay draws each NIP-42 challenge from a fresh key.
nostr = { version = "0.45.3", default-features = false, features = ["std", "os-rng"] }
# `hooks`: the store installs its own WAL hook and progress handlers.
rusqlite = { version = "0.41.1", features = ["bundled", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.48", default-features = false }
# The client half of the door's tests: the version axum's `ws` feature links.
tokio-tungstenite = "0.29"
tower = { version = "0.5.2", features = ["util"] }
tracing = "0.1"
url = "2.5"
