[workspace]
resolver = "3"

[package]
name = "wok-embedding-examples"
version = "0.1.0"
edition = "2024"
publish = false

[features]
websocket = [
    "dep:axum", "dep:futures-util", "dep:serde_json", "dep:tokio",
    "dep:tokio-tungstenite", "dep:wok-ws",
]

[dependencies]
nostr = { version = "0.45.3", default-features = false, features = ["std", "os-rng"] }
tempfile = "3"
wok-store = { path = "../../crates/wok-store" }
axum = { version = "0.8.9", optional = true }
futures-util = { version = "0.3", features = ["sink"], optional = true }
serde_json = { version = "1", optional = true }
tokio = { version = "1.48", features = ["macros", "net", "rt-multi-thread", "time"], optional = true }
tokio-tungstenite = { version = "0.29", optional = true }
wok-ws = { path = "../../crates/wok-ws", optional = true }

[[example]]
name = "sheltered"
required-features = ["websocket"]
