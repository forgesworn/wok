name: Container image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the standalone image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: localhost/wok-standalone:ci
          cache-from: type=gha,scope=wok-verify
          cache-to: type=gha,scope=wok-verify,mode=max
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.94.1
      - name: Exercise the packaged relay, its persistent volume and its wide writes
        env:
          WOK_TEST_IMAGE: localhost/wok-standalone:ci
        run: >-
          cargo test --locked -p wokd --test wokd -- --ignored --exact --nocapture
          container::packaged_relay_preserves_member_events
          container::packaged_relay_takes_wide_writes_and_an_operators_removal

  publish:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        name: Choose the image tags
        run: |
          image=ghcr.io/forgesworn/wok
          {
            echo 'list<<EOF'
            echo "$image:$GITHUB_SHA"
            case "$GITHUB_REF" in
              refs/heads/main)
                echo "$image:latest"
                ;;
              refs/tags/v*)
                version="${GITHUB_REF_NAME#v}"
                crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
                if [ "$version" != "$crate" ]; then
                  echo "tag $GITHUB_REF_NAME does not match workspace version $crate" >&2
                  exit 1
                fi
                echo "$image:$version"
                ;;
            esac
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - id: build
        name: Publish amd64 and arm64 images
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha,scope=wok-publish
          cache-to: type=gha,scope=wok-publish,mode=max
      - name: Record the immutable image reference
        run: echo "ghcr.io/forgesworn/wok@${{ steps.build.outputs.digest }}"
