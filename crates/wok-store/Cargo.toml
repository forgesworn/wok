[package]
name = "wok-store"
description = "Durable, partitioned Nostr event store with group commit, live fan-out and a NIP-01/42/45/77 session engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["nostr", "relay", "sqlite", "storage"]
categories = ["database"]
publish = false

[dependencies]
fs2 = { workspace = true }
hex = { workspace = true }
negentropy = { workspace = true }
nostr = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
# `raw_value`: an EVENT frame is parsed once, straight into its parts.
serde_json = { workspace = true, features = ["raw_value"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
# Tests sign throwaway events, which needs `Keys::generate`.
nostr = { workspace = true, features = ["os-rng"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
