[package]
name = "wok-store"
description = "Durable, partitioned Nostr event store with group commit and live fan-out"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["nostr", "relay", "sqlite", "storage"]
categories = ["database"]
publish = false

[dependencies]
fs2 = { workspace = true }
nostr = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
# Tests sign throwaway events, which needs `Keys::generate`.
nostr = { workspace = true, features = ["os-rng"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
