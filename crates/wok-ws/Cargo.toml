[package]
name = "wok-ws"
description = "WebSocket doors for Wok's relay session engine: unbound axum routers sharing one relay's connection and work budgets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["nostr", "relay", "websocket", "axum"]
categories = ["network-programming"]
publish = false

[dependencies]
axum = { workspace = true }
# `sink`: a turn's replies are fed into the socket and flushed once.
futures-util = { workspace = true, features = ["sink"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing = { workspace = true }
url = { workspace = true }
wok-store = { path = "../wok-store" }

[dev-dependencies]
hex = { workspace = true }
negentropy = { workspace = true }
# Tests sign throwaway events, which needs `Keys::generate`.
nostr = { workspace = true, features = ["os-rng"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread"] }
tokio-tungstenite = { workspace = true }
tower = { workspace = true }
