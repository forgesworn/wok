[package]
name = "wokd"
description = "A members-only Nostr relay on Wok: one group's keys, NIP-42 for every read and write"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
axum = { workspace = true }
# The data directory's lock: a removal never edits the store under a running relay.
fs2 = { workspace = true }
nostr = { workspace = true }
rusqlite = { workspace = true }
# Named only for its feature: the curve's precomputed tables at their small
# size. `wokd` is 1.1 MB smaller for it and checks a signature more slowly;
# its frame budget admits a few dozen events a second at most, so the check
# is not where its time goes. Cargo unifies features across one build, so a
# build that includes `wokd` gives every package in it the small tables.
# The version has to be the one `nostr` resolves: a second copy of the crate
# would take the feature and link nothing, which a test in `lib.rs` catches.
secp256k1 = { version = "0.30", default-features = false, features = ["lowmemory"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
# The configuration file. Daemon-only: nothing a library links needs it.
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "ansi"] }
url = { workspace = true }
wok-store = { path = "../wok-store" }
wok-ws = { path = "../wok-ws" }

# glibc's malloc arena limit, set once at start-up (`mallopt`).
[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc = "0.2"

[dev-dependencies]
futures-util = { workspace = true, features = ["sink"] }
# A stock client: does an ordinary Nostr library get through NIP-42 here?
nostr = { workspace = true, features = ["os-rng"] }
nostr-sdk = { version = "0.45", default-features = false, features = ["ring", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
