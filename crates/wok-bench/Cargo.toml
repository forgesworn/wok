[package]
name = "wok-bench"
description = "Baselines for wok-store and wok-ws, plus remote-relay comparisons over WebSocket"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
wok-store = { path = "../wok-store" }
# Signing the corpus needs `Keys::sign_event`, which draws auxiliary
# randomness from the operating system.
nostr = { workspace = true, features = ["os-rng"] }
rusqlite = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
# The fan-out and engine scenarios drive `LiveReceiver::recv` and the
# session engine's writes on a real runtime; `sync` is the start barrier.
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time", "sync", "net"] }
# A session is opened for a relay URL.
url = { workspace = true }
# The socket scenario serves the doors it measures.
wok-ws = { path = "../wok-ws" }
# `axum::serve` runs a door's router on the scenario's own listener.
axum = { workspace = true }
# The socket scenario's clients: real WebSocket connections to that listener.
tokio-tungstenite = { workspace = true }
# Joins the clients' connection setup, and `SinkExt`/`StreamExt` drive a socket.
futures-util = { workspace = true, features = ["sink"] }
