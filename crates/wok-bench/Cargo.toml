[package]
name = "wok-bench"
description = "Store-level baseline benchmark for wok-store: ingest, query, live fan-out and the session engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
wok-store = { path = "../wok-store" }
# Signing the corpus needs `Keys::sign_event`, which draws auxiliary
# randomness from the operating system.
nostr = { workspace = true, features = ["os-rng"] }
rusqlite = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
# The fan-out and engine scenarios drive `LiveReceiver::recv` and the
# session engine's writes on a real runtime; `sync` is the start barrier.
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time", "sync"] }
# A session is opened for a relay URL.
url = { workspace = true }
